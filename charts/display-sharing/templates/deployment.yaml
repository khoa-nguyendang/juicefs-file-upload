apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: display-sharing
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: JUICEFS_NAME
              value: {{ .Values.juicefs.name | quote }}
            - name: JUICEFS_META
              value: {{ .Values.juicefs.meta | quote }}
            - name: JUICEFS_STORAGE
              value: {{ .Values.juicefs.storage | quote }}
            - name: JUICEFS_BUCKET
              value: {{ .Values.juicefs.bucket | quote }}
            - name: JUICEFS_ACCESS_KEY
              value: {{ .Values.juicefs.accessKey | quote }}
            - name: JUICEFS_SECRET_KEY
              value: {{ .Values.juicefs.secretKey | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}