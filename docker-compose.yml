version: '3.8'

services:
  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: juicefs-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: juicefs
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - juicefs-net

  # MinIO Client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: juicefs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb -p myminio/juicefs || true;
      mc admin user add myminio juicefs juicefs123 || true;
      mc admin policy attach myminio readwrite --user juicefs || true;
      echo 'MinIO initialized successfully';
      exit 0;
      "
    networks:
      - juicefs-net

  # Go application for file upload/download
  go-app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: juicefs-go-app
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - SERVER_PORT=8080
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=juicefs
      - MINIO_SECRET_KEY=juicefs123
      - MINIO_USE_SSL=false
    networks:
      - juicefs-net

  # React UI application
  ui-app:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: juicefs-ui
    ports:
      - "3000:3000"
    depends_on:
      - go-app
    environment:
      - NODE_ENV=production
      # API Configuration
      - NEXT_PUBLIC_API_URL=http://go-app:8080
      - NEXT_PUBLIC_API_TIMEOUT=30000
      # MinIO Configuration
      - NEXT_PUBLIC_MINIO_URL=http://minio:9000
      - NEXT_PUBLIC_MINIO_CONSOLE_URL=http://localhost:9001
      # App Configuration
      - NEXT_PUBLIC_APP_NAME=JuiceFS File Browser
      - NEXT_PUBLIC_MAX_UPLOAD_SIZE=104857600
      - NEXT_PUBLIC_ENABLE_DELETE=true
      - NEXT_PUBLIC_ENABLE_UPLOAD=true
      # UI Configuration
      - NEXT_PUBLIC_DEFAULT_VIEW=tree
      - NEXT_PUBLIC_SHOW_HIDDEN_FILES=false
      - NEXT_PUBLIC_FILE_PREVIEW_ENABLED=true
    networks:
      - juicefs-net

networks:
  juicefs-net:
    driver: bridge

volumes:
  minio_data:
    driver: local